server:
  port: 18080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:classpath:application-secret.yml
  application:
    name: backend
  batch:
    job:
      enabled: false

kis:
  open-api:
    app-key: ${KIS_APP_KEY:dummy_app_key}
    app-secret: ${KIS_APP_SECRET:dummy_app_secret}
    domain: ${KIS_DOMAIN:https://openapivts.koreainvestment.com:29443}

public-data:
  service-key: ${DATA_GO_KR_SERVICE_KEY:dummy_service_key}

gemini:
  api-key: ${GEMINI_API_KEY:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      kis:
        base-config: default
      upbit:
        base-config: default
      exchangerate:
        base-config: default
        sliding-window-size: 5
        wait-duration-in-open-state: 20s
      publicdata:
        base-config: default
        sliding-window-size: 5
        wait-duration-in-open-state: 30s
      gemini:
        base-config: default
        sliding-window-size: 5
        wait-duration-in-open-state: 45s
      korail:
        base-config: default
        sliding-window-size: 6
        wait-duration-in-open-state: 15s

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      kis:
        max-attempts: 3
        wait-duration: 500ms
      upbit:
        max-attempts: 2
        wait-duration: 300ms
      exchangerate:
        max-attempts: 2
        wait-duration: 500ms

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
  enabled: ${TELEGRAM_ENABLED:true}


